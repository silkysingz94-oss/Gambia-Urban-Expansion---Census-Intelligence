name: Build GHSL EA statistics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ghsl-ea-stats.yml"
      - "scripts/build_ghsl_ea_stats.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy rasterio shapely pyproj boto3 requests

      - name: Calculate EA-level GHSL statistics
        run: python scripts/build_ghsl_ea_stats.py

      - name: Commit generated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gambia_GHSL_BuiltUp_LandUse_Efficiency.csv
          if git diff --cached --quiet; then
            echo "No changes to the GHSL statistics CSV."
          else
            git commit -m "Add/update GHSL EA built-up statistics"
            git push
          fi
